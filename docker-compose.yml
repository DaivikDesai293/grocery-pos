services:
  postgres:
    image: postgres:16
    container_name: grocery-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
      POSTGRES_DB: grocery_pos
    ports:
      - '5432:5432'
    volumes:
      - grocery_pos_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grocery -d grocery_pos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grocery_pos_data:
